      x-use-case: 'ONBOARDING'
      x-generation-model: 'gpt-5.6-terra'
      x-body-limit-bytes: 1048576
      tags:
        - 'Onboarding'
      description: "Suggests a lesson/unit/track consistent with catalog relationships. Does not replace the recommendation policy or write application progress.\n\nIf provided, X-Request-ID must match requestId and payload.metadata.requestId. Locale must be en/id; N3/N2 targets return 422. Context must be consistent with the catalog; schemas alone do not cover all domain refinements.\n\nMode must be permitted by API_ALLOWED_MODES, with no fallback. New requests require corpusVersion to match the configuration/snapshot. The deadline uses the minimum budget from timeoutMs (100–120000 ms), deadlineAt in UTC, and the API_MAX_DEADLINE_MS server ceiling (default 120000 ms), accounting for monotonic elapsed time since onRequest. API_MAX_CONCURRENT defaults to 4, with no HTTP queue; capacity exhaustion returns 429. Disconnect/shutdown aborts the signal; remote inference termination is not guaranteed.\n\nrequestId is the idempotency key within the API_SERVICE_ID namespace. The fingerprint covers the operation and the entire body, including deadline/metadata. An identical body with a terminal execution is replayed with the same envelope, execution ID, and trace ID, without new events or calls, even after the request deadline has expired. Authentication and mode permissions are still checked. A different body, an in-flight or UNKNOWN execution, a corrupted trace, or a terminal execution without an envelope returns 409; an unreadable or corrupted sidecar returns 503. There is no Idempotency-Key or additional status endpoint. Keep the body identical for replay; do not change the UUID to bypass UNKNOWN. retryable does not authorize repeating inference with a new UUID.\n\nSynthetic examples use historical deadlines. For a new execution, provide consistent new UUIDs and a UTC deadline that has not expired. Response examples are not model outputs or quality guarantees."
  '/health/live':
    get:
      operationId: 'liveness'
      description: 'Bearer authentication is required. A live process returns 200 live; successful authenticated probes do not call providers, Qdrant, or the registry.'
      responses:
        '200':
          description: 'The process is live.'
          content:
            'application/json':
              schema:
                allOf:
                  - $ref: '#/components/schemas/HealthResponse'
                  - properties:
                      status:
                        const: 'live'
              example:
                status: 'live'
        '401':
          description: 'AUTH_FAILED; incorrect or missing token.'
          headers:
            WWW-Authenticate:
              schema:
                type: 'string'
                const: 'Bearer'
              example: 'Bearer'
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:

components:
  securitySchemes:
    serviceBearer:
      type: 'http'
      scheme: 'bearer'
      description: 'Authorization: Bearer <API_SERVICE_TOKEN>. One token represents API_SERVICE_ID; it is not a learner token or provider API key. An unconfigured service token returns 503; an incorrect or missing request token returns 401. Also applies to health probes and replay.'
  schemas:
    AiLanguage:
      type: 'object'
      properties:
        instructionLocale:
          type: 'string'
          enum:
            - 'en'
            - 'id'
        feedbackLocale:
          type: 'string'
          enum:
            - 'en'
            - 'id'
        translationLocale:
          type: 'string'
          enum:
            - 'en'
            - 'id'
      required:
        - 'instructionLocale'
        - 'feedbackLocale'
        - 'translationLocale'
      additionalProperties: false
    AiContextBundle:
      type: 'object'
      properties:
        targetLevel:
          type: 'string'
          enum:
            - 'JLPT_N5'
            - 'JLPT_N4'
            - 'JLPT_N3'
            - 'JLPT_N2'
        currentLevel:
          anyOf:
            - type: 'string'
              enum:
                - 'BEGINNER'
                - 'JLPT_N5'
                - 'JLPT_N4'
                - 'JLPT_N3'
                - 'JLPT_N2'
            - type: 'null'
        currentUnitSlug:
          anyOf:
            - type: 'string'
              minLength: 1
              maxLength: 2000
            - type: 'null'
        catalog:
          minItems: 1
          maxItems: 500
          type: 'array'
          items:
            type: 'object'
            properties:
              skillCode:
                type: 'string'
                minLength: 1
                maxLength: 2000
              title:
                type: 'string'
                minLength: 1
                maxLength: 2000
              lessonSlug:
                type: 'string'
                minLength: 1
                maxLength: 2000
              unitSlug:
                type: 'string'
                minLength: 1
                maxLength: 2000
              trackSlug:
                type: 'string'
                minLength: 1
                maxLength: 2000
            required:
              - 'skillCode'
              - 'title'
              - 'lessonSlug'
              - 'unitSlug'
              - 'trackSlug'
            additionalProperties: false
        weakSkillCodes:
          maxItems: 500
          type: 'array'
          items:
            type: 'string'
            minLength: 1
            maxLength: 2000
        masteredSkillCodes:
          maxItems: 500
          type: 'array'
          items:
            type: 'string'
            minLength: 1
            maxLength: 2000
        recentMistakes:
          maxItems: 20
          type: 'array'
          items:
            type: 'object'
            properties:
              skillCode:
                type: 'string'
                minLength: 1
                maxLength: 2000
              summary:
                type: 'string'
                minLength: 1
                maxLength: 500
            required:
              - 'skillCode'
              - 'summary'
            additionalProperties: false
        lessonUnderstanding:
          maxItems: 500
          type: 'array'
          items:
            type: 'object'
            properties:
              lessonSlug:
                type: 'string'
                minLength: 1
                maxLength: 2000
              level:
                type: 'integer'
                minimum: 0
                maximum: 10
            required:
              - 'lessonSlug'
              - 'level'
            additionalProperties: false
        allowedQuestionTypes:
          maxItems: 4
          type: 'array'
          items:
            type: 'string'
            enum:
              - 'SHORT_FREE_RESPONSE'
              - 'SLOT_FILL'
              - 'ARRANGE_TOKEN'
              - 'FREE_RESPONSE'
      required:
        - 'targetLevel'
        - 'currentLevel'
        - 'currentUnitSlug'
        - 'catalog'
        - 'weakSkillCodes'
        - 'masteredSkillCodes'
        - 'recentMistakes'
        - 'lessonUnderstanding'
        - 'allowedQuestionTypes'
      additionalProperties: false
    GeneratedPracticeSession:
      type: 'object'
      properties:
        questions:
          minItems: 1
          maxItems: 20
          type: 'array'
          items:
            anyOf:
              - type: 'object'
                properties:
                  skillCode:
                    type: 'string'
                    minLength: 1
                    maxLength: 2000
                  difficultyBand:
                    type: 'string'
                    enum:
                      - 'REMEDIAL'
                      - 'STANDARD'
                      - 'STRETCH'
                  questionType:
                    type: 'string'
                    const: 'SHORT_FREE_RESPONSE'
                  gradingStrategy:
                    type: 'string'
                    const: 'DETERMINISTIC'
                  promptPayload:
                    type: 'object'
                    properties:
                      schemaVersion:
                        type: 'number'
                        const: 1
                      promptLanguage:
                        type: 'string'
                        const: 'JA'
                      answerLanguage:
                        type: 'string'
                        const: 'JA'
                      slotCount:
                        type: 'number'
                        const: 1
                      sentenceTemplate:
                        type: 'string'
                        minLength: 1
                        maxLength: 2000
                      blankInputMode:
                        type: 'string'
                        const: 'ROMAJI_TO_KANA'

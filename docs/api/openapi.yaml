  '/health/ready':
    get:
      operationId: 'readiness'
      description: 'Bearer authentication is required. Starts at 503 not_ready; returns 200 ready once the corpus is configured and every permitted mode is available and has a successful execution in the running process. Dependency/trace failures clear the mode success status; restarting clears the cache. Probes perform no inference, Qdrant queries, or warmup. This status does not check current remote availability.'
      responses:
        '200':
          description: 'All permitted modes are ready according to the local cache.'
          content:

                    type: 'string'
                    minLength: 1
                    maxLength: 2000
                  difficultyBand:
                    type: 'string'
                    enum:
                      - 'REMEDIAL'
                      - 'STANDARD'
                      - 'STRETCH'
                  questionType:
                    type: 'string'
                    const: 'SLOT_FILL'
                  gradingStrategy:
                    type: 'string'
                    const: 'DETERMINISTIC'
                  promptPayload:
                    type: 'object'
                    properties:
                      schemaVersion:
                        type: 'number'
                        const: 1
                      promptLanguage:
                        type: 'string'
                        const: 'JA'
                      optionLanguage:
                        type: 'string'
                        const: 'JA'
                      slotCount:
                        type: 'number'
                        const: 1
                      sentenceTemplate:
                        type: 'string'
                        minLength: 1
                        maxLength: 2000
                      options:
                        minItems: 4
                        maxItems: 4
                        type: 'array'
                        items:
                          type: 'object'
                          properties:
                            id:
                              type: 'string'
                              minLength: 1
                              maxLength: 50
                            label:
                              type: 'string'
                              minLength: 1
                              maxLength: 2000
                          required:
                            - 'id'
                            - 'label'
                          additionalProperties: false
                    required:
                      - 'schemaVersion'
                      - 'promptLanguage'
                      - 'optionLanguage'
                      - 'slotCount'
                      - 'sentenceTemplate'
                      - 'options'
                    additionalProperties: false
                  expectedAnswer:
                    type: 'object'
                    properties:
                      correctOptionId:
                        type: 'string'
                        minLength: 1
                        maxLength: 2000
                    required:
                      - 'correctOptionId'
                    additionalProperties: false
                required:
                  - 'skillCode'
                  - 'difficultyBand'
                  - 'questionType'
                  - 'gradingStrategy'
                  - 'promptPayload'
                  - 'expectedAnswer'
                additionalProperties: false
              - type: 'object'
                properties:
                  skillCode:
                    type: 'string'
                    minLength: 1
                    maxLength: 2000
                  difficultyBand:
                    type: 'string'
                    enum:
                      - 'REMEDIAL'
                      - 'STANDARD'
                      - 'STRETCH'
                  questionType:
                    type: 'string'
                    const: 'ARRANGE_TOKEN'
                  gradingStrategy:
                    type: 'string'
                    const: 'DETERMINISTIC'
                  promptPayload:
                    type: 'object'
                    properties:

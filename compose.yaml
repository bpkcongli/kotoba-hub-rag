services:
  qdrant:
    image: qdrant/qdrant:v1.20.2@sha256:c5e32ee251293d2e1f4dd34890ad75eeee5a4f3821a121d6d8b7e4323448b386
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - '127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333'
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
      - ./infra/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    environment:
      RUN_MODE: production
    cpus: 1.0
    mem_limit: 2g
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  qdrant_storage:
  qdrant_snapshots:
